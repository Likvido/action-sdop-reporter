name: 'SDOP/ENGP reporter'
description: 'Reports a production deployment to Visma''s ENGP/SDOP Jira gateway (DORA metrics)'

inputs:
  jira-token:
    description: 'Bearer token for the Visma Jira gateway. Generated in Hubble.'
    required: true
  app-name:
    description: 'Service name (e.g. webapp-api). Becomes part of the per-service Jira label.'
    required: true
  repo-name:
    description: 'The GitHub repository in owner/name form (typically the github.repository context value). Used to namespace the per-service label.'
    required: true
  deployment-start:
    description: 'ISO 8601 UTC timestamp captured immediately before the production deploy step.'
    required: true
  deployment-status:
    description: 'Outcome of the production deploy step: success, failure, cancelled, or skipped.'
    required: true
  exclude-from-metrics:
    description: 'If true, the ENGPexclude label is added so Visma ignores the ticket. Default true; flip to false after Visma has reviewed the onboarding.'
    required: false
    default: 'true'
  dry-run:
    description: 'If true, log the payload but do not call the Jira gateway.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to query the GitHub API for the previous successful run. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}
  jira-host:
    description: 'Visma Jira gateway host. Override only for testing.'
    required: false
    default: 'https://prod.integration-hub.visma.com'

outputs:
  issue-key:
    description: 'The key of the created Jira issue (empty on dry-run).'
    value: ${{ steps.create_issue.outputs.issue_key }}
  from-sha:
    description: 'The SHA used as the start of the lead-time range.'
    value: ${{ steps.find_from_sha.outputs.from_sha }}

runs:
  using: 'composite'
  steps:
    - name: Find SHA of last successful run on this branch
      id: find_from_sha
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        BRANCH: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        # Resolve the workflow_id of the current run so we can list previous runs of the same workflow.
        workflow_id=$(curl -fsSL \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}" \
          | jq -r '.workflow_id')

        if [[ -z "$workflow_id" || "$workflow_id" == "null" ]]; then
          echo "Failed to resolve workflow_id for run ${RUN_ID}" >&2
          exit 1
        fi

        # Most recent successful run on this branch that isn't the current run.
        from_sha=$(curl -fsSL \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${REPO}/actions/workflows/${workflow_id}/runs?status=success&branch=${BRANCH}&per_page=10" \
          | jq -r --argjson rid "${RUN_ID}" '[.workflow_runs[] | select(.id != $rid)] | .[0].head_sha // empty')

        if [[ -z "$from_sha" ]]; then
          # No prior green run on this branch — fall back to the repo's initial commit.
          # Unshallow so rev-list can see history.
          git fetch --unshallow --quiet || git fetch --depth=2147483647 --quiet || true
          from_sha=$(git rev-list --max-parents=0 HEAD | tail -n1)
          echo "No prior successful run on ${BRANCH}; falling back to initial commit ${from_sha}"
        else
          echo "Previous successful run on ${BRANCH} ended at ${from_sha}"
        fi

        echo "from_sha=${from_sha}" >> "$GITHUB_OUTPUT"

    - name: Compute deployment metrics
      id: compute_metrics
      shell: bash
      env:
        FROM_SHA: ${{ steps.find_from_sha.outputs.from_sha }}
        DEPLOY_START: ${{ inputs.deployment-start }}
        DEPLOY_STATUS: ${{ inputs.deployment-status }}
        REPO_NAME: ${{ inputs.repo-name }}
      run: |
        set -euo pipefail

        # Make sure we have full history for the range walk.
        if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
          git fetch --unshallow --quiet || git fetch --depth=2147483647 --quiet || true
        fi

        deploy_end_epoch=$(date -u +%s)
        deploy_end_iso=$(date -u -d "@${deploy_end_epoch}" +%FT%TZ 2>/dev/null || date -u -r "${deploy_end_epoch}" +%FT%TZ)

        deploy_start_epoch=$(date -u -d "${DEPLOY_START}" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "${DEPLOY_START}" +%s)
        deployment_time_minutes=$(( (deploy_end_epoch - deploy_start_epoch + 59) / 60 ))
        if (( deployment_time_minutes < 0 )); then deployment_time_minutes=0; fi

        # Collect first-parent commits in (from_sha, HEAD].
        if git cat-file -e "${FROM_SHA}^{commit}" 2>/dev/null; then
          range="${FROM_SHA}..HEAD"
        else
          # Initial-commit fallback may not be reachable depending on fetch state; widen the range.
          range="HEAD"
        fi

        commits=$(git log --first-parent --pretty=format:'%H %at' ${range} || true)
        number_of_changes=0
        total_lead_minutes=0
        if [[ -n "$commits" ]]; then
          while IFS=' ' read -r sha at; do
            [[ -z "$sha" ]] && continue
            number_of_changes=$((number_of_changes + 1))
            total_lead_minutes=$(( total_lead_minutes + (deploy_end_epoch - at + 59) / 60 ))
          done <<< "$commits"
        fi

        # Build a description: commit log lines, with GitHub issue/PR refs expanded to URLs.
        # Order matters: cross-repo refs (always Likvido.App by convention) before bare refs.
        # Bare #N is treated as a ref in the *current* repo, because GitHub-generated merge
        # commit messages ("Merge pull request #N from ...") use the local PR number.
        # GitHub redirects /issues/N <-> /pull/N, so /issues works for both.
        commitlog=$(git log --first-parent --pretty=format:'- %h %s (%an)' ${range} 2>/dev/null || echo '- (no commits in range)')
        commitlog=$(printf '%s\n' "$commitlog" \
          | sed -E 's@Likvido/Likvido\.App#([0-9]+)@https://github.com/Likvido/Likvido.App/issues/\1@g' \
          | sed -E "s@(^|[^A-Za-z0-9_])#([0-9]+)@\1https://github.com/${REPO_NAME}/issues/\2@g")

        # On non-success outcomes, zero the metric fields per plan.
        if [[ "${DEPLOY_STATUS}" != "success" ]]; then
          deployment_time_minutes=0
          total_lead_minutes=0
          number_of_changes=0
        fi

        {
          echo "deploy_end_iso=${deploy_end_iso}"
          echo "deployment_time_minutes=${deployment_time_minutes}"
          echo "total_lead_minutes=${total_lead_minutes}"
          echo "number_of_changes=${number_of_changes}"
        } >> "$GITHUB_OUTPUT"

        # commitlog is multi-line; use heredoc form for GITHUB_OUTPUT.
        delim="EOF_COMMITLOG_$(date +%s%N)"
        {
          echo "commitlog<<${delim}"
          printf '%s\n' "$commitlog"
          echo "${delim}"
        } >> "$GITHUB_OUTPUT"

    - name: Create Jira issue
      id: create_issue
      shell: bash
      env:
        JIRA_TOKEN: ${{ inputs.jira-token }}
        JIRA_HOST: ${{ inputs.jira-host }}
        APP_NAME: ${{ inputs.app-name }}
        REPO_NAME: ${{ inputs.repo-name }}
        DEPLOY_STATUS: ${{ inputs.deployment-status }}
        EXCLUDE: ${{ inputs.exclude-from-metrics }}
        DRY_RUN: ${{ inputs.dry-run }}
        DEPLOY_END_ISO: ${{ steps.compute_metrics.outputs.deploy_end_iso }}
        DEPLOYMENT_TIME_MIN: ${{ steps.compute_metrics.outputs.deployment_time_minutes }}
        TOTAL_LEAD_MIN: ${{ steps.compute_metrics.outputs.total_lead_minutes }}
        NUMBER_OF_CHANGES: ${{ steps.compute_metrics.outputs.number_of_changes }}
        COMMITLOG: ${{ steps.compute_metrics.outputs.commitlog }}
      run: |
        set -euo pipefail

        repo_short=$(printf '%s' "${REPO_NAME}" | awk -F/ '{print $2}' | tr '[:upper:]' '[:lower:]' | tr '.' '-')
        service_label="sub-${repo_short}-${APP_NAME}"

        # Short SHA for the summary.
        short_sha=$(git rev-parse --short HEAD)
        summary="${APP_NAME} release ${short_sha}"
        description=$(printf 'Changelog:\n%s' "${COMMITLOG}")

        # Build info: link back to the GitHub Actions workflow run.
        build_info="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        labels_json=$(jq -nc --arg svc "${service_label}" --arg excl "${EXCLUDE}" '
          if $excl == "true" then [$svc, "ENGPexclude"] else [$svc] end
        ')

        payload=$(jq -nc \
          --arg summary "${summary}" \
          --arg description "${description}" \
          --arg deploy_end "${DEPLOY_END_ISO}" \
          --arg build_info "${build_info}" \
          --argjson deploy_time "${DEPLOYMENT_TIME_MIN}" \
          --argjson lead_time "${TOTAL_LEAD_MIN}" \
          --argjson changes "${NUMBER_OF_CHANGES}" \
          --argjson labels "${labels_json}" \
          '{
            fields: {
              project: { id: "40203" },
              issuetype: { name: "SDOP Deployment" },
              components: [ { name: "1664-Likvido" } ],
              summary: $summary,
              description: $description,
              labels: $labels,
              customfield_16561: $deploy_end,
              customfield_19460: $build_info,
              customfield_19761: $deploy_time,
              customfield_26160: $lead_time,
              customfield_27260: $changes
            }
          }')

        echo "Payload:"
        echo "${payload}" | jq .

        if [[ "${DRY_RUN}" == "true" ]]; then
          echo "dry-run: skipping create_issue call"
          echo "issue_key=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Capture body + status separately so we can print the error body on non-2xx.
        body_file=$(mktemp)
        http_code=$(curl -sSL -X POST \
          -H "Authorization: Bearer ${JIRA_TOKEN}" \
          -H "Content-Type: application/json" \
          --data "${payload}" \
          -o "${body_file}" \
          -w '%{http_code}' \
          "${JIRA_HOST}/jira_gateway/create_issue")

        echo "HTTP status: ${http_code}"
        echo "Response body:"
        cat "${body_file}"
        echo

        if [[ "${http_code}" != 2* ]]; then
          echo "create_issue failed with HTTP ${http_code}" >&2
          exit 1
        fi

        issue_key=$(jq -r '.key // empty' < "${body_file}")
        if [[ -z "${issue_key}" ]]; then
          echo "create_issue returned 2xx but no .key in response" >&2
          exit 1
        fi

        echo "Created Jira issue: ${issue_key}"
        echo "issue_key=${issue_key}" >> "$GITHUB_OUTPUT"

    - name: Transition Jira issue
      if: steps.create_issue.outputs.issue_key != ''
      shell: bash
      env:
        JIRA_TOKEN: ${{ inputs.jira-token }}
        JIRA_HOST: ${{ inputs.jira-host }}
        DEPLOY_STATUS: ${{ inputs.deployment-status }}
        ISSUE_KEY: ${{ steps.create_issue.outputs.issue_key }}
      run: |
        set -euo pipefail

        if [[ "${DEPLOY_STATUS}" == "success" ]]; then
          transition_id="21"  # Released
        else
          transition_id="31"  # Failed
        fi

        body=$(jq -nc --arg id "${transition_id}" '{ transition: { id: $id } }')

        body_file=$(mktemp)
        http_code=$(curl -sSL -X POST \
          -H "Authorization: Bearer ${JIRA_TOKEN}" \
          -H "Content-Type: application/json" \
          --data "${body}" \
          -o "${body_file}" \
          -w '%{http_code}' \
          "${JIRA_HOST}/jira_gateway/do_transition?issueIdOrKey=${ISSUE_KEY}")

        echo "HTTP status: ${http_code}"
        echo "Response body:"
        cat "${body_file}"
        echo

        if [[ "${http_code}" != 2* ]]; then
          echo "do_transition failed with HTTP ${http_code}" >&2
          exit 1
        fi

        echo "Transitioned ${ISSUE_KEY} via transition id ${transition_id}"
